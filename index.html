<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resultados Estadísticos | Mejora del Proceso de Retención Estudiantil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-page: #f1f5f9;
      --bg-card: #ffffff;
      --navy-900: #0f294a;
      --navy-800: #173a66;
      --navy-700: #1e4b82;
      --teal-600: #0d9488;
      --teal-500: #14b8a6;
      --teal-100: #ccfbf1;
      --teal-50: #f0fdfa;
      --slate-900: #0f172a;
      --slate-700: #334155;
      --slate-500: #64748b;
      --slate-400: #94a3b8;
      --slate-200: #e2e8f0;
      --slate-100: #f8fafc;
      --amber-700: #b45309;
      --amber-500: #f59e0b;
      --amber-100: #fef3c7;
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.07), 0 4px 10px -6px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 20px 35px -10px rgba(15, 41, 74, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      background-image: radial-gradient(#cbd5e1 0.75px, transparent 0.75px);
      background-size: 20px 20px;
      color: var(--slate-900);
      line-height: 1.45;
      padding: 2rem 1.25rem 3rem;
    }

    .poster-container {
      max-width: 1260px;
      margin: 0 auto;
    }

    /* Encabezado compacto */
    .poster-header {
      background: linear-gradient(135deg, var(--navy-900) 0%, var(--navy-800) 65%, var(--navy-700) 100%);
      color: #ffffff;
      border-radius: 20px;
      padding: 1.85rem 2.25rem;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
      margin-bottom: 1.35rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1.25rem;
    }

    .poster-header::after {
      content: "";
      position: absolute;
      top: -60px;
      right: -50px;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(20, 184, 166, 0.28) 0%, transparent 70%);
      pointer-events: none;
    }

    .header-kicker {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #93c5fd;
      margin-bottom: 0.45rem;
    }

    .poster-title {
      font-size: clamp(1.35rem, 2.4vw, 1.95rem);
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: -0.02em;
      max-width: 760px;
    }

    .header-meta-box {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      position: relative;
      z-index: 1;
    }

    .meta-tag {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 600;
      color: #f8fafc;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Barra de filtros y leyenda */
    .controls-bar {
      background: var(--bg-card);
      border: 1px solid var(--slate-200);
      border-radius: 14px;
      padding: 0.85rem 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .legend-group {
      display: flex;
      align-items: center;
      gap: 1.15rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--slate-700);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    .swatch-asis {
      background: var(--slate-400);
    }

    .swatch-tobe {
      background: var(--teal-600);
    }

    .swatch-neutral {
      background: var(--amber-500);
    }

    .filter-controls {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: 1px solid var(--slate-200);
      background: #ffffff;
      color: var(--slate-700);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .filter-btn:hover {
      border-color: var(--navy-700);
      color: var(--navy-900);
    }

    .filter-btn.active {
      background: var(--navy-900);
      border-color: var(--navy-900);
      color: #ffffff;
    }

    /* Grid de Tarjetas */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(355px, 1fr));
      gap: 1.35rem;
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--slate-200);
      border-radius: 18px;
      padding: 1.45rem;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .kpi-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }

    .kpi-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--navy-700), var(--teal-600));
    }

    .kpi-card.neutral::before {
      background: var(--amber-500);
    }

    /* Cabecera de Tarjeta */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .kpi-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--navy-700);
      background: #eff6ff;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 0.35rem;
    }

    .kpi-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--slate-900);
      line-height: 1.28;
    }

    .status-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.28rem 0.65rem;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status-significant {
      background: var(--teal-100);
      color: #0f766e;
    }

    .status-neutral {
      background: var(--amber-100);
      color: var(--amber-700);
    }

    /* Bloque de variación destacada */
    .impact-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--teal-50);
      border: 1px solid #99f6e4;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
    }

    .kpi-card.neutral .impact-strip {
      background: #fffbeb;
      border-color: #fde68a;
    }

    .impact-rel {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--teal-600);
      line-height: 1.1;
    }

    .kpi-card.neutral .impact-rel {
      color: var(--amber-700);
    }

    .impact-sub {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--slate-500);
    }

    .impact-pp {
      text-align: right;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--navy-900);
    }

    .impact-pp span {
      display: block;
      font-family: 'Inter', sans-serif;
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--slate-500);
    }

    /* Contenedor de Gráfica de Barras Moderna */
    .chart-wrapper {
      background: var(--slate-100);
      border: 1px solid var(--slate-200);
      border-radius: 12px;
      padding: 0.85rem 0.75rem 0.55rem;
      margin-bottom: 1rem;
    }

    .bar-chart-svg {
      width: 100%;
      height: 168px;
      display: block;
      overflow: visible;
    }

    .bar-rect {
      transform-origin: bottom;
      animation: growBar 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes growBar {
      from {
        transform: scaleY(0);
      }
      to {
        transform: scaleY(1);
      }
    }

    /* Estadísticos inferiores */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .stat-pill {
      background: var(--slate-100);
      border: 1px solid var(--slate-200);
      border-radius: 8px;
      padding: 0.45rem 0.5rem;
      text-align: center;
    }

    .stat-pill .k {
      display: block;
      font-size: 0.66rem;
      font-weight: 600;
      color: var(--slate-500);
      text-transform: uppercase;
    }

    .stat-pill .v {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--navy-900);
    }

    .conclusion-line {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--slate-700);
      padding-left: 0.65rem;
      border-left: 3px solid var(--teal-600);
    }

    .kpi-card.neutral .conclusion-line {
      border-left-color: var(--amber-500);
    }

    @media print {
      body {
        background: #ffffff;
        padding: 0;
      }
      .filter-controls {
        display: none;
      }
      .kpi-card {
        break-inside: avoid;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main class="poster-container">
    <header class="poster-header">
      <div>
        <div class="header-kicker">PUCP · Mejora de Procesos (1IND55) · Grupo 28</div>
        <h1 class="poster-title">Validación Estadística: Escenario AS-IS vs. Propuesta TO-BE</h1>
      </div>
      <div class="header-meta-box">
        <span class="meta-tag">Prueba t-pareada</span>
        <span class="meta-tag">n = 10 réplicas</span>
        <span class="meta-tag">α = 0.05 (t₀ = 1.833)</span>
      </div>
    </header>

    <section class="controls-bar" aria-label="Leyenda y filtros">
      <div class="legend-group">
        <span class="legend-item"><span class="swatch swatch-asis"></span>Base (AS-IS)</span>
        <span class="legend-item"><span class="swatch swatch-tobe"></span>Propuesto (TO-BE · Significativo)</span>
        <span class="legend-item"><span class="swatch swatch-neutral"></span>Propuesto (TO-BE · Sin cambio)</span>
      </div>
      <div class="filter-controls" role="group" aria-label="Filtrar indicadores">
        <button class="filter-btn active" data-filter="all">Todos (5)</button>
        <button class="filter-btn" data-filter="significant">Significativos (4)</button>
        <button class="filter-btn" data-filter="neutral">Sin cambio (1)</button>
      </div>
    </section>

    <section class="cards-grid" id="cardsGrid"></section>
  </main>

  <script>
    const indicators = [
      {
        id: "KPI 01",
        title: "Tasa de Deserción Intra-Ciclo",
        status: "significant",
        badge: "Significativo",
        asis: 13.85,
        tobe: 9.46,
        diff: 4.39,
        sd: 0.088,
        rel: "-31.7%",
        t: "158.55",
        p: "4.02e-17",
        summary: "Se rechaza H₀: reducción sostenida de deserción dentro del ciclo académico."
      },
      {
        id: "KPI 02",
        title: "Porcentaje de Atenciones Inbound",
        status: "significant",
        badge: "Significativo",
        asis: 60.96,
        tobe: 30.01,
        diff: 30.95,
        sd: 0.292,
        rel: "-50.8%",
        t: "335.70",
        p: "4.70e-20",
        summary: "Se rechaza H₀: la gestión preventiva recorta a la mitad la demanda reactiva."
      },
      {
        id: "KPI 03",
        title: "Tasa de Fuga bajo Gestión de Asesores",
        status: "significant",
        badge: "Significativo",
        asis: 29.95,
        tobe: 16.45,
        diff: 13.50,
        sd: 0.275,
        rel: "-45.1%",
        t: "155.31",
        p: "4.83e-17",
        summary: "Se rechaza H₀: mayor efectividad de retención temprana por asesor."
      },
      {
        id: "KPI 04",
        title: "Porcentaje de Desaprobación",
        status: "significant",
        badge: "Significativo",
        asis: 1.48,
        tobe: 0.80,
        diff: 0.68,
        sd: 0.038,
        rel: "-45.9%",
        t: "57.02",
        p: "3.95e-13",
        summary: "Se rechaza H₀: el acompañamiento temprano disminuye la desaprobación."
      },
      {
        id: "KPI 05",
        title: "Trámites con Retraso",
        status: "neutral",
        badge: "No significativo",
        asis: 30.15,
        tobe: 30.07,
        diff: 0.08,
        sd: 0.286,
        rel: "-0.3%",
        t: "0.88",
        p: "0.200",
        summary: "No se rechaza H₀ (t < 1.833): indicador de control externo sin variación esperada."
      }
    ];

    const grid = document.getElementById("cardsGrid");

    function buildBarChartSVG(item, index) {
      const maxVal = Math.max(item.asis, item.tobe) * 1.22;
      const chartTop = 24;
      const chartBottom = 136;
      const maxHeight = chartBottom - chartTop;

      const hAsis = Math.max(6, (item.asis / maxVal) * maxHeight);
      const hTobe = Math.max(6, (item.tobe / maxVal) * maxHeight);

      const yAsis = chartBottom - hAsis;
      const yTobe = chartBottom - hTobe;

      const gradId = `grad-${index}`;
      const tobeColorStart = item.status === "neutral" ? "#d97706" : "#0f766e";
      const tobeColorEnd = item.status === "neutral" ? "#f59e0b" : "#14b8a6";

      return `
        <svg class="bar-chart-svg" viewBox="0 0 300 164" role="img" aria-label="Comparación AS-IS ${item.asis}% frente a TO-BE ${item.tobe}%">
          <defs>
            <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="${tobeColorEnd}" />
              <stop offset="100%" stop-color="${tobeColorStart}" />
            </linearGradient>
          </defs>

          <!-- Líneas guía horizontales -->
          <line x1="24" y1="${chartTop}" x2="276" y2="${chartTop}" stroke="#e2e8f0" stroke-dasharray="3 3" stroke-width="1" />
          <line x1="24" y1="${(chartTop + chartBottom) / 2}" x2="276" y2="${(chartTop + chartBottom) / 2}" stroke="#e2e8f0" stroke-dasharray="3 3" stroke-width="1" />
          <line x1="24" y1="${chartBottom}" x2="276" y2="${chartBottom}" stroke="#cbd5e1" stroke-width="1.5" />

          <!-- Barra AS-IS -->
          <rect class="bar-rect" x="62" y="${yAsis}" width="64" height="${hAsis}" rx="8" fill="#94a3b8" />
          <text x="94" y="${yAsis - 7}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#334155">
            ${item.asis.toFixed(2)}%
          </text>
          <text x="94" y="153" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#475569">
            AS-IS
          </text>

          <!-- Barra TO-BE -->
          <rect class="bar-rect" x="174" y="${yTobe}" width="64" height="${hTobe}" rx="8" fill="url(#${gradId})" />
          <text x="206" y="${yTobe - 7}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="800" fill="${tobeColorStart}">
            ${item.tobe.toFixed(2)}%
          </text>
          <text x="206" y="153" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">
            TO-BE
          </text>
        </svg>
      `;
    }

    function renderCards(filter = "all") {
      grid.innerHTML = "";
      const list = indicators.filter(d => filter === "all" || d.status === filter);

      list.forEach((item, idx) => {
        const card = document.createElement("article");
        card.className = `kpi-card ${item.status === "neutral" ? "neutral" : ""}`;
        card.innerHTML = `
          <div>
            <div class="card-header">
              <div>
                <span class="kpi-tag">${item.id}</span>
                <h2 class="kpi-title">${item.title}</h2>
              </div>
              <span class="status-badge ${item.status === "significant" ? "status-significant" : "status-neutral"}">
                ${item.badge}
              </span>
            </div>

            <div class="impact-strip">
              <div>
                <div class="impact-rel">${item.rel}</div>
                <div class="impact-sub">Variación relativa</div>
              </div>
              <div class="impact-pp">
                −${item.diff.toFixed(2)} pp
                <span>Diferencia media (d̄)</span>
              </div>
            </div>

            <div class="chart-wrapper">
              ${buildBarChartSVG(item, idx)}
            </div>
          </div>

          <div>
            <div class="stats-row">
              <div class="stat-pill">
                <span class="k">t calc</span>
                <span class="v">${item.t}</span>
              </div>
              <div class="stat-pill">
                <span class="k">p-valor</span>
                <span class="v">${item.p}</span>
              </div>
              <div class="stat-pill">
                <span class="k">Sd</span>
                <span class="v">${item.sd.toFixed(3)}</span>
              </div>
            </div>
            <p class="conclusion-line">${item.summary}</p>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        renderCards(btn.dataset.filter);
      });
    });

    renderCards();
  </script>
</body>
</html>
