<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resultados FlexSim | Mejora del Proceso de Retención Estudiantil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-page: #f1f5f9;
      --bg-card: #ffffff;
      --navy-900: #0f294a;
      --navy-800: #173a66;
      --navy-700: #1e4b82;
      --teal-600: #0d9488;
      --teal-500: #14b8a6;
      --teal-100: #ccfbf1;
      --teal-50: #f0fdfa;
      --slate-900: #0f172a;
      --slate-700: #334155;
      --slate-500: #64748b;
      --slate-400: #94a3b8;
      --slate-200: #e2e8f0;
      --slate-100: #f8fafc;
      --amber-700: #b45309;
      --amber-500: #f59e0b;
      --amber-100: #fef3c7;
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.07), 0 4px 10px -6px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 20px 35px -10px rgba(15, 41, 74, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      background-image: radial-gradient(#cbd5e1 0.75px, transparent 0.75px);
      background-size: 20px 20px;
      color: var(--slate-900);
      line-height: 1.45;
      padding: 2.5rem 2rem 3.5rem;
    }

    .poster-container {
      max-width: 1340px;
      margin: 0 auto;
    }

    .poster-header {
      background: linear-gradient(135deg, var(--navy-900) 0%, var(--navy-800) 65%, var(--navy-700) 100%);
      color: #ffffff;
      border-radius: 20px;
      padding: 1.85rem 2.25rem;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
      margin-bottom: 1.6rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1.25rem;
    }

    .poster-header::after {
      content: "";
      position: absolute;
      top: -60px;
      right: -50px;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(20, 184, 166, 0.28) 0%, transparent 70%);
      pointer-events: none;
    }

    .header-kicker {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #93c5fd;
      margin-bottom: 0.45rem;
    }

    .poster-title {
      font-size: clamp(1.35rem, 2.4vw, 1.95rem);
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: -0.02em;
      max-width: 780px;
    }

    .header-meta-box {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      position: relative;
      z-index: 1;
    }

    .meta-tag {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 600;
      color: #f8fafc;
      font-family: 'JetBrains Mono', monospace;
    }

    .controls-bar {
      background: var(--bg-card);
      border: 1px solid var(--slate-200);
      border-radius: 14px;
      padding: 0.85rem 1.25rem;
      margin-bottom: 1.75rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .legend-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1.1rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--slate-700);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    .swatch-asis {
      background: var(--slate-400);
    }

    .swatch-tobe {
      background: var(--teal-600);
    }

    .swatch-neutral {
      background: var(--amber-500);
    }

    .filter-controls {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: 1px solid var(--slate-200);
      background: #ffffff;
      color: var(--slate-700);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .filter-btn:hover {
      border-color: var(--navy-700);
      color: var(--navy-900);
    }

    .filter-btn.active {
      background: var(--navy-900);
      border-color: var(--navy-900);
      color: #ffffff;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(460px, 1fr));
      gap: 1.75rem;
    }

    @media (max-width: 520px) {
      body {
        padding: 1.5rem 1rem 2.5rem;
      }
      .cards-grid {
        grid-template-columns: 1fr;
      }
    }

    .kpi-card {
      background: var(--bg-card);
      border: 1px solid var(--slate-200);
      border-radius: 18px;
      padding: 1.55rem;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .kpi-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }

    .kpi-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--navy-700), var(--teal-600));
    }

    .kpi-card.neutral::before {
      background: var(--amber-500);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .kpi-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--navy-700);
      background: #eff6ff;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 0.35rem;
    }

    .kpi-title {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--slate-900);
      line-height: 1.28;
    }

    .status-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.28rem 0.65rem;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .status-significant {
      background: var(--teal-100);
      color: #0f766e;
    }

    .status-neutral {
      background: var(--amber-100);
      color: var(--amber-700);
    }

    .impact-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--teal-50);
      border: 1px solid #99f6e4;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
    }

    .kpi-card.neutral .impact-strip {
      background: #fffbeb;
      border-color: #fde68a;
    }

    .impact-rel {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--teal-600);
      line-height: 1.1;
    }

    .kpi-card.neutral .impact-rel {
      color: var(--amber-700);
    }

    .impact-sub {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--slate-500);
    }

    .impact-pp {
      text-align: right;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--navy-900);
    }

    .impact-pp span {
      display: block;
      font-family: 'Inter', sans-serif;
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--slate-500);
    }

    .dual-charts-grid {
      display: grid;
      grid-template-columns: 1.38fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    @media (max-width: 620px) {
      .dual-charts-grid {
        grid-template-columns: 1fr;
      }
    }

    .chart-panel {
      background: var(--slate-100);
      border: 1px solid var(--slate-200);
      border-radius: 12px;
      padding: 0.65rem 0.7rem 0.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .chart-panel-title {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--slate-500);
      margin-bottom: 0.35rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chart-svg {
      width: 100%;
      height: 154px;
      display: block;
      overflow: visible;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .stat-pill {
      background: var(--slate-100);
      border: 1px solid var(--slate-200);
      border-radius: 8px;
      padding: 0.45rem 0.5rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stat-pill .k {
      display: block;
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--slate-500);
      text-transform: uppercase;
    }

    .stat-pill .v {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--navy-900);
    }

    .stat-pill .formula {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      font-weight: 500;
      color: var(--slate-500);
      margin-top: 0.12rem;
    }

    .conclusion-line {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--slate-700);
      padding-left: 0.65rem;
      border-left: 3px solid var(--teal-600);
    }

    .kpi-card.neutral .conclusion-line {
      border-left-color: var(--amber-500);
    }

    @media print {
      body {
        background: #ffffff;
        padding: 1.5rem;
      }
      .filter-controls {
        display: none;
      }
      .kpi-card {
        break-inside: avoid;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <main class="poster-container">
    <header class="poster-header">
      <div>
        <div class="header-kicker">PUCP · Mejora de Procesos (1IND55) · Grupo 28 · FlexSim</div>
        <h1 class="poster-title">Validación Estadística en FlexSim: Réplicas y Media (AS-IS vs. TO-BE)</h1>
      </div>
      <div class="header-meta-box">
        <span class="meta-tag">FlexSim · n = 10 réplicas</span>
        <span class="meta-tag">Prueba t-pareada</span>

    <section class="controls-bar" aria-label="Leyenda y filtros">
      <div class="legend-group">

      </div>
      <div class="filter-controls" role="group" aria-label="Filtrar indicadores">
        <button class="filter-btn active" data-filter="all">Todos (5)</button>

        <button class="filter-btn" data-filter="neutral">Variables no significativas (1)</button>
      </div>
    </section>

    <section class="cards-grid" id="cardsGrid"></section>
  </main>

  <script>

        p: "4.70e-20",
        summary: "Se rechaza H₀ (t > 1.833): reducción consistente de ~31 pp en cada corrida.",
        replicas: [
          { r: 1, asis: 61.2, tobe: 30.1, diff: 31.1 },
          { r: 2, asis: 60.5, tobe: 29.8, diff: 30.7 },
          { r: 3, asis: 61.8, tobe: 30.4, diff: 31.4 },
          { r: 4, asis: 60.1, tobe: 29.6, diff: 30.5 },

        summary: "Se rechaza H₀ (t > 1.833): menor fuga en todas las réplicas con baja dispersión.",
        replicas: [

      },

        tobeMean: 0.80,

        rel: "-45.9%",

        replicas: [

          { r: 9, asis: 1.44, tobe: 0.79, diff: 0.65 },

      },
      {
        id: "KPI 05",

        t: "0.88",
        tCrit: "1.833",
        p: "0.200",
        summary: "No se rechaza H₀ (t < 1.833): ambas curvas oscilan cerca de ~30%.",
        replicas: [
          { r: 1, asis: 30.3, tobe: 30.1, diff: 0.2 },

          { r: 5, asis: 30.2, tobe: 30.3, diff: -0.1 },
          { r: 6, asis: 30.1, tobe: 29.8, diff: 0.3 },
          { r: 7, asis: 30.4, tobe: 30.1, diff: 0.3 },
          { r: 8, asis: 29.9, tobe: 30.2, diff: -0.3 },
          { r: 9, asis: 30.2, tobe: 30.0, diff: 0.2 },
          { r: 10, asis: 30.1, tobe: 30.1, diff: 0.0 }
        ]
      }
    ];

    const grid = document.getElementById("cardsGrid");

    function buildReplicasSVG(item) {
      const allVals = item.replicas.flatMap(d => [d.asis, d.tobe]);
      const rawMin = Math.min(...allVals);
      const rawMax = Math.max(...allVals);
      const span = Math.max(rawMax - rawMin, 0.4);
      const yMin = Math.max(0, rawMin - span * 0.28);
      const yMax = rawMax + span * 0.25;

      const left = 34;
      const right = 236;
      const top = 14;
      const bottom = 126;
      const plotW = right - left;
      const plotH = bottom - top;

      const xPos = i => left + (i / (item.replicas.length - 1)) * plotW;
      const yPos = v => bottom - ((v - yMin) / (yMax - yMin)) * plotH;

      const asisPts = item.replicas.map((d, i) => `${xPos(i).toFixed(1)},${yPos(d.asis).toFixed(1)}`);
      const tobePts = item.replicas.map((d, i) => `${xPos(i).toFixed(1)},${yPos(d.tobe).toFixed(1)}`);

      const areaPath = `M ${asisPts.join(" L ")} L ${[...tobePts].reverse().join(" L ")} Z`;
      const asisLine = `M ${asisPts.join(" L ")}`;
      const tobeLine = `M ${tobePts.join(" L ")}`;

      const tobeStroke = item.status === "neutral" ? "#d97706" : "#0d9488";
      const areaFill = item.status === "neutral" ? "rgba(245, 158, 11, 0.14)" : "rgba(13, 148, 136, 0.16)";
      const midVal = (yMax + yMin) / 2;
      const midY = yPos(midVal);

      const pointsAndTicks = item.replicas.map((d, i) => {
        const cx = xPos(i).toFixed(1);
        const cyAsis = yPos(d.asis).toFixed(1);
        const cyTobe = yPos(d.tobe).toFixed(1);
        const rLabel = d.r % 2 === 1 ? `R${d.r}` : "";
        return `
          <line x1="${cx}" y1="${cyAsis}" x2="${cx}" y2="${cyTobe}" stroke="#cbd5e1" stroke-width="0.9" stroke-dasharray="2 2" />
          <circle cx="${cx}" cy="${cyAsis}" r="2.8" fill="#94a3b8" />
          <circle cx="${cx}" cy="${cyTobe}" r="3.2" fill="${tobeStroke}" />
          <text x="${cx}" y="142" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#64748b">${rLabel}</text>
        `;
      }).join("");

      return `
        <svg class="chart-svg" viewBox="0 0 244 150" role="img" aria-label="10 réplicas de ${item.title}">
          <line x1="${left}" y1="${top}" x2="${right}" y2="${top}" stroke="#e2e8f0" stroke-dasharray="3 3" stroke-width="1" />
          <line x1="${left}" y1="${midY.toFixed(1)}" x2="${right}" y2="${midY.toFixed(1)}" stroke="#e2e8f0" stroke-dasharray="3 3" stroke-width="1" />
          <line x1="${left}" y1="${bottom}" x2="${right}" y2="${bottom}" stroke="#cbd5e1" stroke-width="1.2" />

          <text x="${left - 4}" y="${top + 3}" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#64748b">${yMax.toFixed(1)}%</text>
          <text x="${left - 4}" y="${(midY + 3).toFixed(1)}" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#64748b">${midVal.toFixed(1)}%</text>
          <text x="${left - 4}" y="${bottom + 3}" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#64748b">${yMin.toFixed(1)}%</text>

          <path d="${areaPath}" fill="${areaFill}" />
          <path d="${asisLine}" fill="none" stroke="#94a3b8" stroke-width="1.9" />
          <path d="${tobeLine}" fill="none" stroke="${tobeStroke}" stroke-width="2.2" />
          ${pointsAndTicks}
        </svg>
      `;
    }

    function buildMeanBarsSVG(item, index) {
      const maxVal = Math.max(item.asisMean, item.tobeMean) * 1.24;
      const chartTop = 20;
      const chartBottom = 126;
      const maxHeight = chartBottom - chartTop;

      const hAsis = Math.max(6, (item.asisMean / maxVal) * maxHeight);
      const hTobe = Math.max(6, (item.tobeMean / maxVal) * maxHeight);

      const yAsis = chartBottom - hAsis;
      const yTobe = chartBottom - hTobe;

      const gradId = `mean-grad-${index}`;
      const tobeColorStart = item.status === "neutral" ? "#d97706" : "#0f766e";
      const tobeColorEnd = item.status === "neutral" ? "#f59e0b" : "#14b8a6";

      return `
        <svg class="chart-svg" viewBox="0 0 180 150" role="img" aria-label="Media AS-IS ${item.asisMean}% frente a TO-BE ${item.tobeMean}%">
          <defs>
            <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="${tobeColorEnd}" />
              <stop offset="100%" stop-color="${tobeColorStart}" />
            </linearGradient>
          </defs>

          <line x1="14" y1="${chartTop}" x2="166" y2="${chartTop}" stroke="#e2e8f0" stroke-dasharray="3 3" stroke-width="1" />
          <line x1="14" y1="${(chartTop + chartBottom) / 2}" x2="166" y2="${(chartTop + chartBottom) / 2}" stroke="#e2e8f0" stroke-dasharray="3 3" stroke-width="1" />
          <line x1="14" y1="${chartBottom}" x2="166" y2="${chartBottom}" stroke="#cbd5e1" stroke-width="1.2" />

          <rect x="30" y="${yAsis}" width="42" height="${hAsis}" rx="6" fill="#94a3b8" />
          <text x="51" y="${yAsis - 5}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#334155">${item.asisMean.toFixed(2)}%</text>
          <text x="51" y="142" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#475569">AS-IS</text>

          <rect x="108" y="${yTobe}" width="42" height="${hTobe}" rx="6" fill="url(#${gradId})" />
          <text x="129" y="${yTobe - 5}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="800" fill="${tobeColorStart}">${item.tobeMean.toFixed(2)}%</text>
          <text x="129" y="142" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">TO-BE</text>
        </svg>
      `;
    }

    function renderCards(filter = "all") {
      grid.innerHTML = "";
      const list = indicators.filter(d => filter === "all" || d.status === filter);

      list.forEach((item, idx) => {
        const card = document.createElement("article");
        card.className = `kpi-card ${item.status === "neutral" ? "neutral" : ""}`;
        card.innerHTML = `
          <div>
            <div class="card-header">
              <div>
                <span class="kpi-tag">${item.id}</span>
                <h2 class="kpi-title">${item.title}</h2>
              </div>
              <span class="status-badge ${item.status === "significant" ? "status-significant" : "status-neutral"}">
                ${item.badge}
              </span>
            </div>

            <div class="impact-strip">
              <div>
                <div class="impact-rel">${item.rel}</div>
                <div class="impact-sub">Variación relativa</div>
              </div>
              <div class="impact-pp">
                −${item.diffMean.toFixed(2)} pp
                <span>Ganancia pareada (d̄)</span>
              </div>
            </div>

            <div class="dual-charts-grid">
              <div class="chart-panel">
                <div class="chart-panel-title">
                  <span>Réplicas (R1–R10)</span>
                </div>
                ${buildReplicasSVG(item)}
              </div>

              <div class="chart-panel">
                <div class="chart-panel-title">
                  <span>Media (10 corridas)</span>
                </div>
                ${buildMeanBarsSVG(item, idx)}
              </div>
            </div>
          </div>

          <div>
            <div class="stats-row">
              <div class="stat-pill">
                <span class="k">t calc</span>
                <span class="v">${item.t}</span>
                <span class="formula">d̄ / (Sd / √n)</span>
              </div>
              <div class="stat-pill">
                <span class="k">t crítico</span>
                <span class="v">${item.tCrit}</span>
                <span class="formula">α = 0.05 · gl = 9</span>
              </div>
              <div class="stat-pill">
                <span class="k">p-valor</span>
                <span class="v">${item.p}</span>
                <span class="formula">Unilateral</span>
              </div>
            </div>
            <p class="conclusion-line">${item.summary}</p>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        renderCards(btn.dataset.filter);
      });
    });

    renderCards();
  </script>
</body>
</html>
